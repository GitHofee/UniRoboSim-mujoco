[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unirobosim-mujoco"
version = "0.9.2"
description = "MuJoCo adapter for UniRoboSim"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Hofee", email = "lexhofee@gmail.com"}]
dependencies = ["unirobosim>=0.9,<0.11", "mujoco==3.11.0", "numpy>=2.2,<3"]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.entry-points."unirobosim.backends"]
mujoco = "unirobosim_mujoco:create_provider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unirobosim_mujoco = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["unirobosim_mujoco"]
omit = ["*/droid_acceptance.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
